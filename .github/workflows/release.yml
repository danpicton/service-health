name: Verify and release image

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install locked development tools
        run: |
          python -m pip install uv==0.6.9
          uv sync --locked
          uv pip install -r requirements-dev.txt
      - name: Run offline tests and style checks
        env:
          PYTHONPATH: src
        run: |
          uv run --no-sync python -m unittest discover -s tests -v
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src tests

  pr-image:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build amd64 image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: false

  release-image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require a matching version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit(f'Expected a stable vMAJOR.MINOR.PATCH tag: {tag}')
          with open('pyproject.toml', 'rb') as project_file:
              version = tomllib.load(project_file)['project']['version']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match project version {version}')
          PY
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Log in to GHCR with the job token
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish amd64 image with SBOM and provenance
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/danpicton/service-health:${{ github.ref_name }}
            ghcr.io/danpicton/service-health:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Record the immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf 'Published `ghcr.io/danpicton/service-health@%s`\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
